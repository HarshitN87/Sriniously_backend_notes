<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c1d"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <filter id="sh5"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.25"/></filter>
    <marker id="a5" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#80ffdb"/>
    </marker>
    <marker id="a6" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffb347"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="url(#bg5)" rx="16"/>
  <text x="450" y="35" text-anchor="middle" fill="#e0e0ff" font-size="20" font-weight="700">🔄 OAuth 2.0 Authorization Code Flow</text>

  <!-- Actors -->
  <rect x="40" y="55" width="130" height="45" rx="10" fill="#667eea" filter="url(#sh5)"/>
  <text x="105" y="82" text-anchor="middle" fill="white" font-size="13" font-weight="700">👤 User</text>

  <rect x="240" y="55" width="130" height="45" rx="10" fill="#f368e0" filter="url(#sh5)"/>
  <text x="305" y="82" text-anchor="middle" fill="white" font-size="13" font-weight="700">🖥️ Your App</text>

  <rect x="530" y="55" width="150" height="45" rx="10" fill="#feca57" filter="url(#sh5)"/>
  <text x="605" y="78" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="700">🔐 Auth Provider</text>
  <text x="605" y="93" text-anchor="middle" fill="#4a3a00" font-size="9">(Google, GitHub...)</text>

  <rect x="750" y="55" width="120" height="45" rx="10" fill="#2ed573" filter="url(#sh5)"/>
  <text x="810" y="82" text-anchor="middle" fill="#0d1b2a" font-size="13" font-weight="700">📦 Resource</text>

  <!-- Timelines -->
  <line x1="105" y1="110" x2="105" y2="470" stroke="#667eea" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="305" y1="110" x2="305" y2="470" stroke="#f368e0" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="605" y1="110" x2="605" y2="470" stroke="#feca57" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>
  <line x1="810" y1="110" x2="810" y2="470" stroke="#2ed573" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>

  <!-- Step 1 -->
  <circle cx="65" cy="135" r="11" fill="#667eea"/><text x="65" y="139" text-anchor="middle" fill="white" font-size="10" font-weight="700">1</text>
  <line x1="120" y1="135" x2="290" y2="135" stroke="#80ffdb" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="205" y="128" text-anchor="middle" fill="#80ffdb" font-size="11">Click "Login with Google"</text>

  <!-- Step 2 -->
  <circle cx="260" cy="170" r="11" fill="#f368e0"/><text x="260" y="174" text-anchor="middle" fill="white" font-size="10" font-weight="700">2</text>
  <line x1="320" y1="170" x2="590" y2="170" stroke="#80ffdb" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="455" y="163" text-anchor="middle" fill="#80ffdb" font-size="11">Redirect to Google /authorize</text>

  <!-- Step 3 -->
  <circle cx="560" cy="210" r="11" fill="#feca57"/><text x="560" y="214" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="700">3</text>
  <line x1="590" y1="210" x2="120" y2="210" stroke="#ffb347" stroke-width="1.5" marker-end="url(#a6)"/>
  <text x="355" y="203" text-anchor="middle" fill="#ffb347" font-size="11">Show consent screen: "Allow access?"</text>

  <!-- Step 4 -->
  <circle cx="65" cy="250" r="11" fill="#667eea"/><text x="65" y="254" text-anchor="middle" fill="white" font-size="10" font-weight="700">4</text>
  <line x1="120" y1="250" x2="590" y2="250" stroke="#80ffdb" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="355" y="243" text-anchor="middle" fill="#80ffdb" font-size="11">User grants permission</text>

  <!-- Step 5 -->
  <circle cx="560" cy="290" r="11" fill="#feca57"/><text x="560" y="294" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="700">5</text>
  <line x1="590" y1="290" x2="320" y2="290" stroke="#ffb347" stroke-width="1.5" marker-end="url(#a6)"/>
  <text x="455" y="283" text-anchor="middle" fill="#ffb347" font-size="11">Redirect with authorization code</text>

  <!-- Step 6 -->
  <circle cx="260" cy="330" r="11" fill="#f368e0"/><text x="260" y="334" text-anchor="middle" fill="white" font-size="10" font-weight="700">6</text>
  <line x1="320" y1="330" x2="590" y2="330" stroke="#80ffdb" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="455" y="323" text-anchor="middle" fill="#80ffdb" font-size="11">Exchange code for access token</text>

  <!-- Step 7 -->
  <circle cx="560" cy="370" r="11" fill="#feca57"/><text x="560" y="374" text-anchor="middle" fill="#1a1a2e" font-size="10" font-weight="700">7</text>
  <line x1="590" y1="370" x2="320" y2="370" stroke="#ffb347" stroke-width="1.5" marker-end="url(#a6)"/>
  <text x="455" y="363" text-anchor="middle" fill="#ffb347" font-size="11">Return access_token + id_token</text>

  <!-- Step 8 -->
  <circle cx="260" cy="410" r="11" fill="#f368e0"/><text x="260" y="414" text-anchor="middle" fill="white" font-size="10" font-weight="700">8</text>
  <line x1="320" y1="410" x2="795" y2="410" stroke="#80ffdb" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="555" y="403" text-anchor="middle" fill="#80ffdb" font-size="11">Fetch user data with access_token</text>

  <!-- Step 9 -->
  <circle cx="770" cy="445" r="11" fill="#2ed573"/><text x="770" y="449" text-anchor="middle" fill="#0d1b2a" font-size="10" font-weight="700">9</text>
  <line x1="795" y1="445" x2="320" y2="445" stroke="#ffb347" stroke-width="1.5" marker-end="url(#a6)"/>
  <text x="555" y="438" text-anchor="middle" fill="#ffb347" font-size="11">Return user profile data</text>

  <text x="450" y="488" text-anchor="middle" fill="#8888bb" font-size="10" font-style="italic">Your app never sees the user's Google password — it only receives a scoped access token</text>
</svg>
