<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#80ffdb"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffb347"/>
    </marker>
    <filter id="sh"><feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="900" height="500" fill="url(#bg2)" rx="16"/>
  <text x="450" y="38" text-anchor="middle" fill="#e0f0ff" font-size="22" font-weight="700">🪙 JWT Authentication Flow</text>
  <rect x="60" y="60" width="170" height="50" rx="12" fill="#43e97b" filter="url(#sh)"/>
  <text x="145" y="88" text-anchor="middle" fill="#0d1b2a" font-size="15" font-weight="700">🖥️ Client</text>
  <rect x="620" y="60" width="170" height="50" rx="12" fill="#fa709a" filter="url(#sh)"/>
  <text x="705" y="85" text-anchor="middle" fill="#1a1a2e" font-size="15" font-weight="700">⚙️ Server</text>
  <text x="705" y="102" text-anchor="middle" fill="#4a1942" font-size="10">(Stateless — No Session Store)</text>
  <line x1="145" y1="120" x2="145" y2="470" stroke="#43e97b" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="705" y1="120" x2="705" y2="470" stroke="#fa709a" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>
  <circle cx="100" cy="145" r="13" fill="#43e97b"/><text x="100" y="150" text-anchor="middle" fill="#0d1b2a" font-size="12" font-weight="700">1</text>
  <line x1="165" y1="145" x2="685" y2="145" stroke="#80ffdb" stroke-width="2" marker-end="url(#a1)"/>
  <text x="425" y="138" text-anchor="middle" fill="#80ffdb" font-size="13">POST /login {email, password}</text>
  <circle cx="750" cy="185" r="13" fill="#fa709a"/><text x="750" y="190" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="700">2</text>
  <text x="640" y="190" text-anchor="middle" fill="#ffb3c1" font-size="11">✅ Validate → Generate JWT</text>
  <rect x="310" y="210" width="280" height="70" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <text x="450" y="230" text-anchor="middle" fill="#e0e0ff" font-size="12" font-weight="600">JWT = Header . Payload . Signature</text>
  <text x="370" y="260" text-anchor="middle" fill="#ff6b6b" font-size="10">eyJhbGc... (Header)</text>
  <text x="450" y="260" text-anchor="middle" fill="#feca57" font-size="10">eyJ1c2Vy... (Payload)</text>
  <text x="545" y="260" text-anchor="middle" fill="#48dbfb" font-size="10">SflKxw... (Sig)</text>
  <circle cx="750" cy="305" r="13" fill="#fa709a"/><text x="750" y="310" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="700">3</text>
  <line x1="685" y1="305" x2="165" y2="305" stroke="#ffb347" stroke-width="2" marker-end="url(#a2)"/>
  <text x="425" y="298" text-anchor="middle" fill="#ffb347" font-size="13">Response: {token: "eyJhbG..."}</text>
  <circle cx="100" cy="345" r="13" fill="#43e97b"/><text x="100" y="350" text-anchor="middle" fill="#0d1b2a" font-size="12" font-weight="700">4</text>
  <text x="250" y="350" text-anchor="middle" fill="#80ffdb" font-size="11">💾 Store JWT in localStorage/cookie</text>
  <circle cx="100" cy="385" r="13" fill="#43e97b"/><text x="100" y="390" text-anchor="middle" fill="#0d1b2a" font-size="12" font-weight="700">5</text>
  <line x1="165" y1="385" x2="685" y2="385" stroke="#80ffdb" stroke-width="2" marker-end="url(#a1)"/>
  <text x="425" y="378" text-anchor="middle" fill="#80ffdb" font-size="13">GET /profile  Authorization: Bearer eyJ...</text>
  <circle cx="750" cy="420" r="13" fill="#fa709a"/><text x="750" y="425" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="700">6</text>
  <text x="640" y="425" text-anchor="middle" fill="#ffb3c1" font-size="11">🔍 Verify signature + decode</text>
  <circle cx="750" cy="455" r="13" fill="#fa709a"/><text x="750" y="460" text-anchor="middle" fill="#1a1a2e" font-size="12" font-weight="700">7</text>
  <line x1="685" y1="455" x2="165" y2="455" stroke="#ffb347" stroke-width="2" marker-end="url(#a2)"/>
  <text x="425" y="448" text-anchor="middle" fill="#ffb347" font-size="13">200 OK {user profile data}</text>
  <text x="450" y="490" text-anchor="middle" fill="#8888bb" font-size="11" font-style="italic">No session store needed — the token carries the identity. Server only verifies the signature.</text>
</svg>
