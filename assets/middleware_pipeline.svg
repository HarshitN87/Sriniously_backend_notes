<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c1d"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <filter id="sh4"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.25"/></filter>
    <marker id="a4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#80ffdb"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="url(#bg4)" rx="16"/>
  <text x="450" y="35" text-anchor="middle" fill="#e0e0ff" font-size="20" font-weight="700">🔗 Middleware Pipeline — Request Lifecycle</text>

  <!-- Request arrow in -->
  <text x="30" y="160" fill="#80ffdb" font-size="14" font-weight="600">📨 Request</text>
  <line x1="110" y1="155" x2="145" y2="155" stroke="#80ffdb" stroke-width="2" marker-end="url(#a4)"/>

  <!-- Middleware boxes -->
  <rect x="150" y="70" width="120" height="170" rx="10" fill="rgba(102,126,234,0.15)" stroke="#667eea" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="210" y="100" text-anchor="middle" fill="#667eea" font-size="12" font-weight="700">CORS</text>
  <text x="210" y="120" text-anchor="middle" fill="#8080b0" font-size="9">Cross-Origin</text>
  <text x="210" y="135" text-anchor="middle" fill="#8080b0" font-size="9">Checks</text>
  <text x="210" y="165" text-anchor="middle" fill="#667eea" font-size="18">→</text>
  <text x="210" y="200" text-anchor="middle" fill="#606090" font-size="9">next()</text>

  <line x1="275" y1="155" x2="295" y2="155" stroke="#80ffdb" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="300" y="70" width="120" height="170" rx="10" fill="rgba(243,104,224,0.15)" stroke="#f368e0" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="360" y="100" text-anchor="middle" fill="#f368e0" font-size="12" font-weight="700">Auth</text>
  <text x="360" y="120" text-anchor="middle" fill="#b080b0" font-size="9">Verify Token</text>
  <text x="360" y="135" text-anchor="middle" fill="#b080b0" font-size="9">Set req.user</text>
  <text x="360" y="165" text-anchor="middle" fill="#f368e0" font-size="18">→</text>
  <text x="360" y="200" text-anchor="middle" fill="#906090" font-size="9">next()</text>

  <line x1="425" y1="155" x2="445" y2="155" stroke="#80ffdb" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="450" y="70" width="120" height="170" rx="10" fill="rgba(254,202,87,0.15)" stroke="#feca57" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="510" y="100" text-anchor="middle" fill="#feca57" font-size="12" font-weight="700">Logging</text>
  <text x="510" y="120" text-anchor="middle" fill="#b0a070" font-size="9">Log method,</text>
  <text x="510" y="135" text-anchor="middle" fill="#b0a070" font-size="9">URL, timing</text>
  <text x="510" y="165" text-anchor="middle" fill="#feca57" font-size="18">→</text>
  <text x="510" y="200" text-anchor="middle" fill="#908060" font-size="9">next()</text>

  <line x1="575" y1="155" x2="595" y2="155" stroke="#80ffdb" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="600" y="70" width="120" height="170" rx="10" fill="rgba(46,213,115,0.15)" stroke="#2ed573" stroke-width="1.5" filter="url(#sh4)"/>
  <text x="660" y="100" text-anchor="middle" fill="#2ed573" font-size="12" font-weight="700">Parsing</text>
  <text x="660" y="120" text-anchor="middle" fill="#80b090" font-size="9">JSON body</text>
  <text x="660" y="135" text-anchor="middle" fill="#80b090" font-size="9">parsing</text>
  <text x="660" y="165" text-anchor="middle" fill="#2ed573" font-size="18">→</text>
  <text x="660" y="200" text-anchor="middle" fill="#609060" font-size="9">next()</text>

  <line x1="725" y1="155" x2="745" y2="155" stroke="#80ffdb" stroke-width="2" marker-end="url(#a4)"/>

  <!-- Handler -->
  <rect x="750" y="100" width="120" height="110" rx="12" fill="rgba(255,107,107,0.2)" stroke="#ff6b6b" stroke-width="2" filter="url(#sh4)"/>
  <text x="810" y="140" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="700">🎯 Handler</text>
  <text x="810" y="160" text-anchor="middle" fill="#c08080" font-size="10">Route-specific</text>
  <text x="810" y="175" text-anchor="middle" fill="#c08080" font-size="10">logic</text>

  <!-- Response arrow -->
  <text x="450" y="280" text-anchor="middle" fill="#ffb347" font-size="12" font-weight="600">📤 Response travels back through middleware in reverse order ←</text>
</svg>
