<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c1d"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <filter id="sh3"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="900" height="460" fill="url(#bg3)" rx="16"/>
  <text x="450" y="38" text-anchor="middle" fill="#e0e0ff" font-size="22" font-weight="700">🏗️ Backend Layered Architecture</text>

  <!-- Controller Layer -->
  <rect x="150" y="65" width="600" height="80" rx="14" fill="rgba(102,126,234,0.2)" stroke="#667eea" stroke-width="2" filter="url(#sh3)"/>
  <text x="450" y="95" text-anchor="middle" fill="#667eea" font-size="18" font-weight="700">🎮 Controller Layer</text>
  <text x="450" y="120" text-anchor="middle" fill="#a0a0d0" font-size="12">Receives HTTP requests · Validates input · Sends HTTP responses</text>
  <text x="450" y="136" text-anchor="middle" fill="#7070a0" font-size="10">Handles request parsing, input validation, response formatting</text>

  <!-- Arrow down -->
  <polygon points="450,155 440,155 450,175 460,155" fill="#667eea"/>
  <text x="490" y="168" fill="#667eea" font-size="10">Transformed DTOs ↓</text>

  <!-- Service Layer -->
  <rect x="150" y="185" width="600" height="80" rx="14" fill="rgba(243,104,224,0.15)" stroke="#f368e0" stroke-width="2" filter="url(#sh3)"/>
  <text x="450" y="215" text-anchor="middle" fill="#f368e0" font-size="18" font-weight="700">⚙️ Service Layer</text>
  <text x="450" y="240" text-anchor="middle" fill="#d0a0d0" font-size="12">Business logic · Authorization checks · Orchestration</text>
  <text x="450" y="256" text-anchor="middle" fill="#a070a0" font-size="10">Framework-agnostic, testable in isolation, no HTTP awareness</text>

  <!-- Arrow down -->
  <polygon points="450,275 440,275 450,295 460,275" fill="#f368e0"/>
  <text x="490" y="288" fill="#f368e0" font-size="10">Domain objects ↓</text>

  <!-- Repository Layer -->
  <rect x="150" y="305" width="600" height="80" rx="14" fill="rgba(72,219,251,0.15)" stroke="#48dbfb" stroke-width="2" filter="url(#sh3)"/>
  <text x="450" y="335" text-anchor="middle" fill="#48dbfb" font-size="18" font-weight="700">💾 Repository Layer</text>
  <text x="450" y="360" text-anchor="middle" fill="#a0d0e0" font-size="12">Database queries · Data persistence · Cache management</text>
  <text x="450" y="376" text-anchor="middle" fill="#70a0b0" font-size="10">Abstracts storage details — SQL, NoSQL, file system, external APIs</text>

  <!-- Arrow down to DB -->
  <polygon points="450,395 440,395 450,415 460,395" fill="#48dbfb"/>

  <!-- Database -->
  <rect x="350" y="420" width="200" height="30" rx="8" fill="rgba(46,213,115,0.2)" stroke="#2ed573" stroke-width="1.5"/>
  <text x="450" y="440" text-anchor="middle" fill="#2ed573" font-size="13" font-weight="600">🗄️ Database / Storage</text>

  <!-- Side labels -->
  <text x="80" y="110" text-anchor="middle" fill="#667eea" font-size="11" font-weight="600" transform="rotate(-90, 80, 110)">HTTP-Aware</text>
  <text x="80" y="230" text-anchor="middle" fill="#f368e0" font-size="11" font-weight="600" transform="rotate(-90, 80, 230)">Pure Logic</text>
  <text x="80" y="350" text-anchor="middle" fill="#48dbfb" font-size="11" font-weight="600" transform="rotate(-90, 80, 350)">Data Access</text>
</svg>
