<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e0e0ff" font-size="22" font-weight="700" filter="url(#glow)">🔐 Session-Based Authentication Flow</text>

  <!-- Client Box -->
  <rect x="40" y="70" width="180" height="60" rx="12" fill="url(#clientGrad)" filter="url(#shadow)"/>
  <text x="130" y="100" text-anchor="middle" fill="white" font-size="15" font-weight="600">🖥️ Client</text>
  <text x="130" y="118" text-anchor="middle" fill="#e0d0ff" font-size="11">(Browser)</text>

  <!-- Server Box -->
  <rect x="370" y="70" width="180" height="60" rx="12" fill="url(#serverGrad)" filter="url(#shadow)"/>
  <text x="460" y="100" text-anchor="middle" fill="white" font-size="15" font-weight="600">⚙️ Server</text>
  <text x="460" y="118" text-anchor="middle" fill="#ffe0e0" font-size="11">(Backend)</text>

  <!-- Session Store Box -->
  <rect x="690" y="70" width="180" height="60" rx="12" fill="url(#storeGrad)" filter="url(#shadow)"/>
  <text x="780" y="100" text-anchor="middle" fill="white" font-size="15" font-weight="600">💾 Session Store</text>
  <text x="780" y="118" text-anchor="middle" fill="#d0f0ff" font-size="11">(Memory / Redis / DB)</text>

  <!-- Vertical timeline lines -->
  <line x1="130" y1="140" x2="130" y2="490" stroke="#667eea" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="460" y1="140" x2="460" y2="490" stroke="#f5576c" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="780" y1="140" x2="780" y2="490" stroke="#4facfe" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Step 1: Login Request -->
  <g>
    <rect x="50" y="155" width="24" height="24" rx="12" fill="#667eea"/>
    <text x="62" y="172" text-anchor="middle" fill="white" font-size="12" font-weight="700">1</text>
    <line x1="140" y1="167" x2="440" y2="167" stroke="#a8edea" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="290" y="160" text-anchor="middle" fill="#a8edea" font-size="12" font-weight="600">POST /login {email, password}</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a8edea"/>
    </marker>
    <marker id="arrowback" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffd6a5"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#90caf9"/>
    </marker>
  </defs>

  <!-- Step 2: Validate Credentials -->
  <g>
    <rect x="380" y="195" width="24" height="24" rx="12" fill="#f5576c"/>
    <text x="392" y="212" text-anchor="middle" fill="white" font-size="12" font-weight="700">2</text>
    <rect x="420" y="195" width="200" height="24" rx="6" fill="rgba(245,87,108,0.15)" stroke="#f5576c" stroke-width="1"/>
    <text x="520" y="212" text-anchor="middle" fill="#ffb3c1" font-size="11">✅ Validate credentials</text>
  </g>

  <!-- Step 3: Create Session -->
  <g>
    <rect x="380" y="240" width="24" height="24" rx="12" fill="#f5576c"/>
    <text x="392" y="257" text-anchor="middle" fill="white" font-size="12" font-weight="700">3</text>
    <line x1="470" y1="252" x2="760" y2="252" stroke="#90caf9" stroke-width="2" marker-end="url(#arrowblue)"/>
    <text x="615" y="245" text-anchor="middle" fill="#90caf9" font-size="12" font-weight="600">Store session {userId, expiry, data}</text>
  </g>

  <!-- Step 4: Session ID stored -->
  <g>
    <rect x="700" y="275" width="24" height="24" rx="12" fill="#4facfe"/>
    <text x="712" y="292" text-anchor="middle" fill="white" font-size="12" font-weight="700">4</text>
    <rect x="730" y="275" width="160" height="24" rx="6" fill="rgba(79,172,254,0.15)" stroke="#4facfe" stroke-width="1"/>
    <text x="810" y="292" text-anchor="middle" fill="#b3e5fc" font-size="11">sessionId → session data</text>
  </g>

  <!-- Step 5: Set-Cookie response -->
  <g>
    <rect x="380" y="320" width="24" height="24" rx="12" fill="#f5576c"/>
    <text x="392" y="337" text-anchor="middle" fill="white" font-size="12" font-weight="700">5</text>
    <line x1="440" y1="332" x2="150" y2="332" stroke="#ffd6a5" stroke-width="2" marker-end="url(#arrowback)"/>
    <text x="290" y="325" text-anchor="middle" fill="#ffd6a5" font-size="12" font-weight="600">Set-Cookie: sessionId=abc123</text>
  </g>

  <!-- Step 6: Subsequent request with cookie -->
  <g>
    <rect x="50" y="365" width="24" height="24" rx="12" fill="#667eea"/>
    <text x="62" y="382" text-anchor="middle" fill="white" font-size="12" font-weight="700">6</text>
    <line x1="140" y1="377" x2="440" y2="377" stroke="#a8edea" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="290" y="370" text-anchor="middle" fill="#a8edea" font-size="12" font-weight="600">GET /profile  Cookie: sessionId=abc123</text>
  </g>

  <!-- Step 7: Lookup session -->
  <g>
    <rect x="380" y="405" width="24" height="24" rx="12" fill="#f5576c"/>
    <text x="392" y="422" text-anchor="middle" fill="white" font-size="12" font-weight="700">7</text>
    <line x1="470" y1="417" x2="760" y2="417" stroke="#90caf9" stroke-width="2" marker-end="url(#arrowblue)"/>
    <text x="615" y="410" text-anchor="middle" fill="#90caf9" font-size="12" font-weight="600">Lookup sessionId=abc123</text>
  </g>

  <!-- Step 8: Return user data -->
  <g>
    <rect x="380" y="445" width="24" height="24" rx="12" fill="#f5576c"/>
    <text x="392" y="462" text-anchor="middle" fill="white" font-size="12" font-weight="700">8</text>
    <line x1="440" y1="457" x2="150" y2="457" stroke="#ffd6a5" stroke-width="2" marker-end="url(#arrowback)"/>
    <text x="290" y="450" text-anchor="middle" fill="#ffd6a5" font-size="12" font-weight="600">200 OK {user profile data}</text>
  </g>

  <!-- Footer note -->
  <text x="450" y="505" text-anchor="middle" fill="#8888aa" font-size="11" font-style="italic">The server must lookup the session store on every request — this is the stateful bottleneck</text>
</svg>
